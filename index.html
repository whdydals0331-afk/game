<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!--ARTIFACT-START-->
<title>카타르시스</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#edf1ee">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<section class="screen" id="home">
  <div class="head">
    <div>
      <div class="logo">카타<span>르시스</span></div>
      <div class="tag">들어갈 듯 말 듯… 그러다 딱. 그 순간만 모은 게임</div>
    </div>
    <button class="icon-btn mute" type="button" aria-label="소리"></button>
  </div>
  <div id="game-list"></div>
</section>

<section class="screen" id="play" hidden>
  <div class="bar">
    <button class="icon-btn back" type="button" aria-label="처음으로"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="t" id="play-title"></div>
    <button class="icon-btn mute" type="button" aria-label="소리"></button>
  </div>
  <div class="sub-row"><span id="play-gauge"></span></div>
  <div class="stage-wrap" id="stage-wrap"><canvas id="stage"></canvas></div>
  <div class="play-foot"><div class="hint" id="play-hint"></div><div class="actions" id="play-actions"></div></div>
</section>

<section class="screen" id="blocks" hidden>
  <div class="bar">
    <button class="icon-btn back" type="button" aria-label="처음으로"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="t">빈칸 채우기</div>
    <button class="icon-btn" id="block-new" type="button" aria-label="다른 판"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v5h-5"/></svg></button>
  </div>
  <div class="stage">
    <div class="hint"></div>
    <div class="board"><div class="board-in" id="board"></div></div>
    <div class="tray" id="tray"></div>
  </div>
</section>

<div class="toast" id="toast" hidden></div>
<div class="overlay" id="overlay" hidden>
  <div class="sheet">
    <small id="ov-lv"></small>
    <div class="stars" id="ov-stars"></div>
    <h2 id="ov-title">딱 맞았어요</h2>
    <p id="ov-sub"></p>
    <div class="note" id="ov-note"></div>
    <button class="btn" id="ov-next" type="button">다음 단계</button>
    <button class="btn ghost" id="ov-home" type="button">다른 게임 고르기</button>
  </div>
</div>

<script src="js/core.js"></script>
<script src="js/g-slot.js"></script>
<script src="js/g-spin.js"></script>
<script src="js/g-book.js"></script>
<script src="js/g-plug.js"></script>
<script src="js/g-lid.js"></script>
<script src="js/g-vacuum.js"></script>
<script src="js/g-blocks.js"></script>
<script>DDAK.boot();</script>
<!--ARTIFACT-END-->
</body>
</html>
